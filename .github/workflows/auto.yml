name: Run Google Drive Automation

on:
  workflow_dispatch:
  
permissions:
  contents: write

jobs:
  run-script:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-oauthlib

      - name: Install FFmpeg
        run: |
          choco install ffmpeg -y
        shell: powershell

      - name: Verify FFmpeg installation
        run: ffmpeg -version
        shell: powershell

      - name: Run script
        run: python ww2.py
        shell: powershell

      - name: Commit and push uploaded_files.txt
        run: |
          if (Test-Path "uploaded_files.txt") {
              git config --global user.name "GitHub Bot"
              git config --global user.email "github-bot@example.com"
              git add uploaded_files.txt, app.log, processed_folders.txt, downloaded_files.txt
              git commit -m "Update uploaded_files.txt"
              git push
          } else {
              Write-Output "uploaded_files.txt not found. Skipping commit."
          }
        shell: powershell
